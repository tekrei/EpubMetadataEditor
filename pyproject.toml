[project]
name = "epubmetadataeditor"
version = "0.1.0"
description = "A simple Epub Metadata Editor"
authors = [
    { name = "T. E. Kalaycı" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "lxml>=4.6.2",
    "Send2Trash>=1.8.3",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff"
]

[project.scripts]
epub-editor = "main:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
