[project]
name = "epubmetadataeditor"
version = "0.1.0"
description = "A simple Epub Metadata Editor"
authors = [
    { name = "T. E. Kalaycı" }
]
readme = "README.md"
requires-python = ">=3.13"
LICENSE = "Apache-2.0"
dependencies = [
    "gradio>=6.8.0"
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: Pyflakes/Error, I: isort, N: pep8-naming, UP: pyupgrade, B: flake8-bugbear
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
